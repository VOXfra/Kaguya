name: Build Vehicle Camera VI

on:
  push:
    paths:
      - 'modules/VehicleCameraVI/**'
      - '.github/workflows/build-vehicle-camera-vi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch SHVDNE reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found in SHVDNE archive.' }
          New-Item -ItemType Directory -Force modules/VehicleCameraVI/refs | Out-Null
          Copy-Item $ref.FullName modules/VehicleCameraVI/refs/ScriptHookVDotNet3.dll
      - name: Build
        shell: pwsh
        run: dotnet build modules/VehicleCameraVI/VehicleCameraVI.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/scripts | Out-Null
          Copy-Item modules/VehicleCameraVI/bin/Release/net48/VehicleCameraVI.dll dist/scripts/VehicleCameraVI.dll
          Copy-Item modules/VehicleCameraVI/config/VehicleCameraVI.ini dist/scripts/VehicleCameraVI.ini
          Copy-Item modules/VehicleCameraVI/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path dist/* -DestinationPath VehicleCameraVI-v0.1.0.zip -Force
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: VehicleCameraVI-v0.1.0
          path: VehicleCameraVI-v0.1.0.zip
          if-no-files-found: error
