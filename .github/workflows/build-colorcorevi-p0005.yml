name: Build ColorCoreVI P0005

on:
  push:
    paths:
      - 'modules/GraphicOverhaulVI/runtime/ColorCoreVIExternalProbe.cpp'
      - 'modules/GraphicOverhaulVI/runtime/ColorCoreVIExternalProbeFixture.cpp'
      - 'modules/GraphicOverhaulVI/runtime/ColorCoreVIFakeStreamline.cpp'
      - 'modules/GraphicOverhaulVI/RUN-COLORCORE-PRESENTATION-PROBE.cmd'
      - 'modules/GraphicOverhaulVI/P0005_README.txt'
      - '.github/workflows/build-colorcorevi-p0005.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject dangerous in-process primitives
        shell: pwsh
        run: |
          $src = Get-Content modules/GraphicOverhaulVI/runtime/ColorCoreVIExternalProbe.cpp -Raw
          @('WriteProcessMemory','VirtualAllocEx','CreateRemoteThread','SetWindowsHookEx','MH_CreateHook','MH_EnableHook') | ForEach-Object {
            if ($src -match [regex]::Escape($_)) { throw "Forbidden primitive present in external probe source: $_" }
          }
          Write-Host 'No injection/process-write/hook primitive found.'

      - name: Build external probe and deterministic fixture
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX modules\GraphicOverhaulVI\runtime\ColorCoreVIExternalProbe.cpp /link /OUT:ColorCoreVIExternalProbe.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX modules\GraphicOverhaulVI\runtime\ColorCoreVIExternalProbeFixture.cpp d3d12.lib dxgi.lib /link /OUT:GTA5_Enhanced.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX /LD modules\GraphicOverhaulVI\runtime\ColorCoreVIFakeStreamline.cpp /link /OUT:sl.interposer.dll
          if errorlevel 1 exit /b %errorlevel%

      - name: Execute external-process validation
        shell: cmd
        run: |
          del /q ColorCoreVI_ExternalProbe.log 2>nul
          start "" /b GTA5_Enhanced.exe
          timeout /t 1 /nobreak >nul
          ColorCoreVIExternalProbe.exe --wait 10 --duration 6
          if errorlevel 1 exit /b %errorlevel%

      - name: Validate detected presentation chain and x64 PE
        shell: pwsh
        run: |
          if (-not (Test-Path ColorCoreVI_ExternalProbe.log)) { throw 'External probe log missing.' }
          $log = Get-Content ColorCoreVI_ExternalProbe.log -Raw
          @(
            'ColorCoreVI External Presentation Chain Probe P0005 v0.1.4',
            'NO DLL/ASI INJECTION',
            'PROCESS_FOUND',
            'MODULE_INTERESTING',
            'name=dxgi.dll',
            'name=d3d12.dll',
            'name=sl.interposer.dll',
            'IMPORT_DLL',
            'dll=dxgi.dll',
            'dll=d3d12.dll',
            'IAT_SYMBOL',
            'IAT_SUMMARY',
            'PROBE_COMPLETE'
          ) | ForEach-Object {
            if ($log -notmatch [regex]::Escape($_)) { throw "Required evidence marker missing: $_" }
          }
          if ($log -match 'HOOKS_READY|FACTORY_HOOKS_READY|REAL_SWAPCHAIN_HOOKS_READY') {
            throw 'External v0.1.4 unexpectedly contains active-hook markers.'
          }
          $exe = Get-Item ColorCoreVIExternalProbe.exe
          if ($exe.Length -lt 10000) { throw 'External probe binary unexpectedly small.' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45) { throw 'PE signature missing.' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Probe machine is not AMD64/x64: 0x{0:X4}" -f $machine) }
          Write-Host 'P0005 v0.1.4 external CI validation PASS.'

      - name: Package P0005 external diagnostic patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ColorCoreVIExternalProbe.exe dist/ColorCoreVIExternalProbe.exe
          Copy-Item modules/GraphicOverhaulVI/RUN-COLORCORE-PRESENTATION-PROBE.cmd dist/RUN-COLORCORE-PRESENTATION-PROBE.cmd
          Copy-Item modules/GraphicOverhaulVI/P0005_README.txt dist/README-P0005.txt
          Copy-Item ColorCoreVI_ExternalProbe.log dist/CI-VALIDATION-EXAMPLE.log
          $sha = (Get-FileHash dist/ColorCoreVIExternalProbe.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/BUILD-INFO.txt @(
            'GraphicOverhaulVI P0005 ColorCoreVI External Presentation Chain Probe',
            'Version: 0.1.4',
            'Mode: EXTERNAL READ-ONLY OBSERVATION',
            'DLL/ASI injection: NONE',
            'API hooks: NONE',
            'Process writes: NONE',
            "EXE SHA-256: $sha",
            'CI: Windows x64 + real external attach + DXGI/D3D12/sl.interposer detection + remote IAT parsing PASS'
          )
          Compress-Archive -Path dist/* -DestinationPath GraphicOverhaulVI-P0005-ExternalPresentationProbe-v0.1.4.zip -Force

      - name: Upload validated P0005 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphicOverhaulVI-P0005-ExternalPresentationProbe-v0.1.4
          path: GraphicOverhaulVI-P0005-ExternalPresentationProbe-v0.1.4.zip
          if-no-files-found: error
