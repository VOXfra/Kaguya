name: Build VOX RDR2 TFIT2 Metadata Bridge

on:
  push:
    branches:
      - rc3-runtime-repair
    paths:
      - 'tools/rdr2-tfit2/**'
      - '.github/workflows/build-rdr2-tfit2-bridge.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bridge
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /EHsc /std:c++17 /O2 /MT /W4 /DUNICODE /D_UNICODE /Fe:dist\VOX-RDR2-TFIT2-Bridge.exe tools\rdr2-tfit2\VOX-RDR2-TFIT2-Bridge.cpp
          if not exist dist\VOX-RDR2-TFIT2-Bridge.exe exit /b 1

      - name: TFIT2 deterministic self-test
        shell: cmd
        run: |
          dist\VOX-RDR2-TFIT2-Bridge.exe --self-test
          if errorlevel 1 exit /b 1

      - name: Validate pinned public fingerprint schema
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force smoke | Out-Null
          $base = 'https://raw.githubusercontent.com/0x1F9F1/Swage/201320d61ae04909f01af247c41f864a9174b691'
          Invoke-WebRequest -UseBasicParsing -Headers @{'User-Agent'='VOX-RDR2-TFIT2-CI'} -Uri "$base/src/games/rage/hashes/RDR2.h" -OutFile smoke/RDR2.h
          Invoke-WebRequest -UseBasicParsing -Headers @{'User-Agent'='VOX-RDR2-TFIT2-CI'} -Uri "$base/src/games/rage/rpf8.cpp" -OutFile smoke/rpf8.cpp
          & .\dist\VOX-RDR2-TFIT2-Bridge.exe --fingerprint-self-test --fingerprints smoke/RDR2.h --rpf8-source smoke/rpf8.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fingerprint schema test failed' }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/VOX-RDR2-TFIT2-Bridge.exe package/
          Copy-Item tools/rdr2-tfit2/Run-VOX-RDR2-TFIT2-Bridge.bat package/
          Copy-Item tools/rdr2-tfit2/README.txt package/
          Compress-Archive -Path package/* -DestinationPath VOX-RDR2-TFIT2-Metadata-Bridge-v0.4.0.zip -Force
          Get-FileHash VOX-RDR2-TFIT2-Metadata-Bridge-v0.4.0.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: VOX-RDR2-TFIT2-Metadata-Bridge-v0.4.0
          path: VOX-RDR2-TFIT2-Metadata-Bridge-v0.4.0.zip
          if-no-files-found: error
