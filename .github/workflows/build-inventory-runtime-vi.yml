name: Build Inventory Runtime VI

on:
  push:
    paths:
      - 'modules/InventoryRuntimeVI/**'
      - '.github/workflows/build-inventory-runtime-vi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SHVDNE reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found.' }
          New-Item -ItemType Directory -Force modules/InventoryRuntimeVI/refs | Out-Null
          Copy-Item $ref.FullName modules/InventoryRuntimeVI/refs/ScriptHookVDotNet3.dll
      - name: Build
        shell: pwsh
        run: dotnet build modules/InventoryRuntimeVI/InventoryRuntimeVI.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/scripts | Out-Null
          Copy-Item modules/InventoryRuntimeVI/bin/Release/net48/InventoryRuntimeVI.dll dist/scripts/InventoryRuntimeVI.dll
          Copy-Item modules/InventoryRuntimeVI/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path dist/* -DestinationPath InventoryRuntimeVI-v0.3.0.zip -Force
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: InventoryRuntimeVI-v0.3.0
          path: InventoryRuntimeVI-v0.3.0.zip
          if-no-files-found: error
