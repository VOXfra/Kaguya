name: Build Ped Overhaul VI

on:
  push:
    paths:
      - 'modules/PedOverhaulVI/**'
      - '.github/workflows/build-ped-overhaul-vi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch SHVDNE reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found in SHVDNE archive.' }
          New-Item -ItemType Directory -Force modules/PedOverhaulVI/refs | Out-Null
          Copy-Item $ref.FullName modules/PedOverhaulVI/refs/ScriptHookVDotNet3.dll
      - name: Build
        shell: pwsh
        run: dotnet build modules/PedOverhaulVI/PedOverhaulVI.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/scripts | Out-Null
          Copy-Item modules/PedOverhaulVI/bin/Release/net48/PedOverhaulVI.dll dist/scripts/PedOverhaulVI.dll
          Copy-Item modules/PedOverhaulVI/config/PedOverhaulVI.ini dist/scripts/PedOverhaulVI.ini
          Copy-Item modules/PedOverhaulVI/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path dist/* -DestinationPath PedOverhaulVI-v0.4.0.zip -Force
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: PedOverhaulVI-v0.4.0
          path: PedOverhaulVI-v0.4.0.zip
          if-no-files-found: error
