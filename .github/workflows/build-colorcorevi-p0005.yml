name: Build ColorCoreVI P0005

on:
  push:
    paths:
      - 'modules/GraphicOverhaulVI/runtime/ColorCoreVIOutputProbe.cpp'
      - 'modules/GraphicOverhaulVI/runtime/ColorCoreVIOutputProbeHarness.cpp'
      - 'modules/GraphicOverhaulVI/P0005_README.txt'
      - '.github/workflows/build-colorcorevi-p0005.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build passive ASI and validation harness
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX /LD modules\GraphicOverhaulVI\runtime\ColorCoreVIOutputProbe.cpp /link user32.lib /OUT:ColorCoreVIOutputProbe.asi
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX modules\GraphicOverhaulVI\runtime\ColorCoreVIOutputProbeHarness.cpp d3d12.lib dxgi.lib user32.lib /link /OUT:ColorCoreVIOutputProbeHarness.exe
          if errorlevel 1 exit /b %errorlevel%

      - name: Execute passive presentation-chain validation
        shell: cmd
        run: |
          del /q ColorCoreVI_OutputProbe.log 2>nul
          ColorCoreVIOutputProbeHarness.exe "%CD%\ColorCoreVIOutputProbe.asi"

      - name: Validate probe log and binary
        shell: pwsh
        run: |
          if (-not (Test-Path ColorCoreVI_OutputProbe.log)) { throw 'Probe log missing.' }
          $log = Get-Content ColorCoreVI_OutputProbe.log -Raw
          @(
            'ColorCoreVI Output Probe P0005 v0.1.3',
            'NO API hooks',
            'PROBE_READY',
            'MODULE_SCAN',
            'SYSTEM_EXPORT',
            'IAT_SUMMARY'
          ) | ForEach-Object {
            if ($log -notmatch [regex]::Escape($_)) { throw "Required log marker missing: $_" }
          }
          if ($log -match 'HOOKS_READY|FACTORY_HOOKS_READY|REAL_SWAPCHAIN_HOOKS_READY') {
            throw 'v0.1.3 unexpectedly contains active-hook markers.'
          }
          $asi = Get-Item ColorCoreVIOutputProbe.asi
          if ($asi.Length -lt 10000) { throw 'ASI binary unexpectedly small.' }
          $bytes = [System.IO.File]::ReadAllBytes($asi.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45) { throw 'PE signature missing.' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Probe machine is not AMD64/x64: 0x{0:X4}" -f $machine) }
          Write-Host 'P0005 v0.1.3 passive CI validation PASS.'

      - name: Package P0005 experimental patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ColorCoreVIOutputProbe.asi dist/ColorCoreVIOutputProbe.asi
          Copy-Item modules/GraphicOverhaulVI/P0005_README.txt dist/README-P0005.txt
          Copy-Item ColorCoreVI_OutputProbe.log dist/CI-VALIDATION-EXAMPLE.log
          $sha = (Get-FileHash dist/ColorCoreVIOutputProbe.asi -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/BUILD-INFO.txt @(
            'GraphicOverhaulVI P0005 ColorCoreVI Presentation Chain Probe',
            'Version: 0.1.3',
            'Mode: PASSIVE OBSERVATION ONLY',
            'API hooks: NONE',
            'Vtable patching: NONE',
            "ASI SHA-256: $sha",
            'CI: Windows x64 + pre-existing DXGI factory + passive module/IAT inspection PASS'
          )
          Compress-Archive -Path dist/* -DestinationPath GraphicOverhaulVI-P0005-ColorOutputProbe-v0.1.3.zip -Force

      - name: Upload validated P0005 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphicOverhaulVI-P0005-ColorOutputProbe-v0.1.3
          path: GraphicOverhaulVI-P0005-ColorOutputProbe-v0.1.3.zip
          if-no-files-found: error
