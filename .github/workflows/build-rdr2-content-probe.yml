name: Build VOX RDR2 RPF8 Recursive Content Probe

on:
  push:
    branches:
      - rc3-runtime-repair
    paths:
      - 'tools/rdr2-content-probe/**'
      - 'tools/rdr2-tfit2/**'
      - '.github/workflows/build-rdr2-content-probe.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist dist mkdir dist
          cl /nologo /EHsc /std:c++17 /O2 /MT /W4 /DUNICODE /D_UNICODE /Fe:dist\VOX-RDR2-RPF8-Content-Probe.exe tools\rdr2-content-probe\VOX-RDR2-RPF8-Content-Probe.cpp
          if errorlevel 1 exit /b 1
          if not exist dist\VOX-RDR2-RPF8-Content-Probe.exe exit /b 1

      - name: Deterministic TFIT2 and nested RPF8 self-test
        shell: cmd
        run: |
          dist\VOX-RDR2-RPF8-Content-Probe.exe --self-test
          if errorlevel 1 exit /b 1

      - name: Validate pinned public fingerprint schema
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force smoke | Out-Null
          $base = 'https://raw.githubusercontent.com/0x1F9F1/Swage/201320d61ae04909f01af247c41f864a9174b691'
          Invoke-WebRequest -UseBasicParsing -Headers @{'User-Agent'='VOX-RDR2-Content-Probe-CI'} -Uri "$base/src/games/rage/hashes/RDR2.h" -OutFile smoke/RDR2.h
          Invoke-WebRequest -UseBasicParsing -Headers @{'User-Agent'='VOX-RDR2-Content-Probe-CI'} -Uri "$base/src/games/rage/rpf8.cpp" -OutFile smoke/rpf8.cpp
          & .\dist\VOX-RDR2-RPF8-Content-Probe.exe --fingerprint-self-test --fingerprints smoke/RDR2.h --rpf8-source smoke/rpf8.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fingerprint schema test failed' }

      - name: Validate package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/VOX-RDR2-RPF8-Content-Probe.exe package/
          Copy-Item tools/rdr2-content-probe/Run-VOX-RDR2-RPF8-Content-Probe.bat package/
          Copy-Item tools/rdr2-content-probe/README.txt package/
          $bat = Get-Content package/Run-VOX-RDR2-RPF8-Content-Probe.bat -Raw
          if ($bat -notmatch 'No raw asset' -or $bat -notmatch 'VOX-RDR2-RPF8-Content-Probe') { throw 'Launcher safety markers missing' }
          Compress-Archive -Path package/* -DestinationPath VOX-RDR2-RPF8-Recursive-Content-Probe-v0.6.0.zip -Force
          Get-FileHash VOX-RDR2-RPF8-Recursive-Content-Probe-v0.6.0.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: VOX-RDR2-RPF8-Recursive-Content-Probe-v0.6.0
          path: VOX-RDR2-RPF8-Recursive-Content-Probe-v0.6.0.zip
          if-no-files-found: error
