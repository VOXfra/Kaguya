name: Build Vehicle Runtime VI

on:
  push:
    paths:
      - 'modules/VehicleRuntimeVI/**'
      - '.github/workflows/build-vehicle-runtime-vi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch SHVDNE reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found.' }
          New-Item -ItemType Directory -Force modules/VehicleRuntimeVI/refs | Out-Null
          Copy-Item $ref.FullName modules/VehicleRuntimeVI/refs/ScriptHookVDotNet3.dll
      - name: Build
        shell: pwsh
        run: dotnet build modules/VehicleRuntimeVI/VehicleRuntimeVI.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/scripts | Out-Null
          Copy-Item modules/VehicleRuntimeVI/bin/Release/net48/VehicleRuntimeVI.dll dist/scripts/VehicleRuntimeVI.dll
          Copy-Item modules/VehicleRuntimeVI/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path dist/* -DestinationPath VehicleRuntimeVI-v0.2.0.zip -Force
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: VehicleRuntimeVI-v0.2.0
          path: VehicleRuntimeVI-v0.2.0.zip
          if-no-files-found: error
