name: Build Police Overhaul VI

on:
  push:
    paths:
      - 'modules/PoliceOverhaulVI/**'
      - '.github/workflows/build-police-overhaul-vi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch SHVDNE reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found in SHVDNE archive.' }
          New-Item -ItemType Directory -Force modules/PoliceOverhaulVI/refs | Out-Null
          Copy-Item $ref.FullName modules/PoliceOverhaulVI/refs/ScriptHookVDotNet3.dll
      - name: Build
        shell: pwsh
        run: dotnet build modules/PoliceOverhaulVI/PoliceOverhaulVI.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/scripts | Out-Null
          Copy-Item modules/PoliceOverhaulVI/bin/Release/net48/PoliceOverhaulVI.dll dist/scripts/PoliceOverhaulVI.dll
          Copy-Item modules/PoliceOverhaulVI/config/PoliceOverhaulVI.ini dist/scripts/PoliceOverhaulVI.ini
          Copy-Item modules/PoliceOverhaulVI/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path dist/* -DestinationPath PoliceOverhaulVI-v0.2.0.zip -Force
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: PoliceOverhaulVI-v0.2.0
          path: PoliceOverhaulVI-v0.2.0.zip
          if-no-files-found: error
