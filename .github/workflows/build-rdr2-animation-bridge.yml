name: Build RDR2 to GTA V Direct Animation Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - rdr2-animation-bridge
    paths:
      - 'tools/RDR2AnimationBridge/**'
      - 'modules/RDR2AnimationBridgeVI/**'
      - '.github/workflows/build-rdr2-animation-bridge.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout Kaguya bridge branch
        uses: actions/checkout@v4

      - name: Clone pinned Swage source
        shell: pwsh
        run: |
          git clone https://github.com/0x1F9F1/Swage.git _deps/Swage
          git -C _deps/Swage checkout 201320d61ae04909f01af247c41f864a9174b691

      - name: Apply VOX Oodle + headless + deterministic hash patches
        shell: pwsh
        run: |
          python tools/RDR2AnimationBridge/patch_swage.py _deps/Swage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/RDR2AnimationBridge/patch_swage_hash_alias.py _deps/Swage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure ArchiveExplorer x64
        shell: pwsh
        run: |
          cmake -S _deps/Swage -B _build/Swage -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build patched ArchiveExplorer Release
        shell: pwsh
        run: |
          cmake --build _build/Swage --config Release --target ArchiveExplorer -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clone pinned CodeWalker source
        shell: pwsh
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git _deps/CodeWalker
          git -C _deps/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e

      - name: Build RSC8 to RSC7 YCD compatibility bridge
        shell: pwsh
        run: |
          $cw = "$($PWD.Path)\_deps\CodeWalker"
          dotnet publish tools/RDR2AnimationBridge/Rdr2YcdCompat/Rdr2YcdCompat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:CodeWalkerRoot="$cw" -o _build/Rdr2YcdCompat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build RPF7 DLC packer
        shell: pwsh
        run: |
          cargo build --manifest-path tools/RDR2AnimationBridge/VoxRpfPack/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch ScriptHookVDotNet Enhanced reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found.' }
          New-Item -ItemType Directory -Force modules/RDR2AnimationBridgeVI/refs | Out-Null
          Copy-Item $ref.FullName modules/RDR2AnimationBridgeVI/refs/ScriptHookVDotNet3.dll

      - name: Build GTA V Enhanced playback runtime
        shell: pwsh
        run: |
          dotnet build modules/RDR2AnimationBridgeVI/RDR2AnimationBridgeVI.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble direct bridge package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/VOX-RDR2-to-GTAV-Direct-Bridge'
          New-Item -ItemType Directory -Force -Path "$dist/helper", "$dist/bridge", "$dist/runtime" | Out-Null

          $archiveExplorer = Get-ChildItem _build/Swage -Recurse -Filter ArchiveExplorer.exe | Select-Object -First 1
          if (-not $archiveExplorer) { throw 'ArchiveExplorer.exe was not produced.' }
          Copy-Item $archiveExplorer.FullName "$dist/helper/ArchiveExplorer.exe"
          Get-ChildItem $archiveExplorer.Directory.FullName -Filter *.dll -File | ForEach-Object {
            Copy-Item $_.FullName "$dist/helper/$($_.Name)"
          }

          Copy-Item _build/Rdr2YcdCompat/* "$dist/bridge/" -Recurse
          $packer = Get-ChildItem tools/RDR2AnimationBridge/VoxRpfPack/target/release -Filter vox-rpf-pack.exe | Select-Object -First 1
          if (-not $packer) { throw 'vox-rpf-pack.exe was not produced.' }
          Copy-Item $packer.FullName "$dist/bridge/vox-rpf-pack.exe"

          $runtime = 'modules/RDR2AnimationBridgeVI/bin/Release/net48/RDR2AnimationBridgeVI.dll'
          if (-not (Test-Path $runtime)) { throw 'RDR2AnimationBridgeVI.dll was not produced.' }
          Copy-Item $runtime "$dist/runtime/RDR2AnimationBridgeVI.dll"

          Copy-Item tools/RDR2AnimationBridge/RUN_DIRECT_GTA_BRIDGE.ps1 "$dist/RUN_DIRECT_GTA_BRIDGE.ps1"
          Copy-Item tools/RDR2AnimationBridge/RUN_DIRECT_GTA_BRIDGE.bat "$dist/RUN_DIRECT_GTA_BRIDGE.bat"

          @"
          VOX RDR2 -> GTA V Direct Animation Bridge v0.1.3
          Fixes: stable RDR2 key loading plus deterministic hash aliases for every RPF8 entry, even when Swage resolves a Rockstar filename from local name databases.
          End-to-end target: one local RDR2 YCD -> CodeWalker ClipDictionary -> GTA V RSC7 YCD -> RPF7 DLC -> Enhanced F8 playback runtime.
          RDR2 assets, encryption keys and Oodle DLL are not bundled.
          "@ | Set-Content -Encoding UTF8 "$dist/BUILD.txt"

          Get-ChildItem $dist -Recurse | Select-Object FullName,Length

      - name: Upload direct bridge
        uses: actions/upload-artifact@v4
        with:
          name: VOX-RDR2-to-GTAV-Direct-Bridge-v0.1.3
          path: dist/VOX-RDR2-to-GTAV-Direct-Bridge
          if-no-files-found: error
          compression-level: 9
