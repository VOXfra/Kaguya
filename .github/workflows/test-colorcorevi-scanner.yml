name: Test ColorCoreVI Scanner

on:
  push:
    paths:
      - 'modules/GraphicOverhaulVI/**'
      - '.github/workflows/test-colorcorevi-scanner.yml'
  workflow_dispatch:

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw 'Expected Windows PowerShell Desktop edition.' }
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.x.' }

      - name: Create auto-detect fixture installs
        shell: powershell
        run: |
          $fh6 = 'C:\Games\Forza Horizon 6'
          $gta = 'C:\Games\GTAVEnhanced'
          if (Test-Path 'C:\Games') { Remove-Item 'C:\Games' -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $fh6, $gta | Out-Null
          Set-Content -LiteralPath (Join-Path $fh6 'tonemap_hdr_bt2020.txt') -Value 'tonemap HDR10 ST.2084 BT.2020 exposure gamut LUT scene-linear 1000 nits' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $gta 'postprocess_color.txt') -Value 'post-process color HDR exposure bloom gamma sRGB display' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $gta 'visualsettings.dat') -Value 'HDR exposure color' -Encoding UTF8

      - name: Run exact double-click path with no arguments
        shell: cmd
        env:
          COLORCORE_NO_PAUSE: '1'
        run: call modules\GraphicOverhaulVI\RUN-COLORCORE-SCAN.cmd

      - name: Validate no-argument scan outputs
        shell: powershell
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'modules\GraphicOverhaulVI\scan-output'
          $required = @('scan_summary.json','color_candidates.csv','extension_summary.csv','scan_errors.csv','file_inventory.csv','README.txt')
          foreach ($name in $required) {
            $path = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing output: $name" }
          }
          $summary = Get-Content -LiteralPath (Join-Path $out 'scan_summary.json') -Raw | ConvertFrom-Json
          if ([int]$summary.inventoryCount -lt 3) { throw "Expected at least 3 inventoried files, got $($summary.inventoryCount)" }
          if ([int]$summary.candidateCount -lt 2) { throw "Expected at least 2 candidates, got $($summary.candidateCount)" }
          if ([int]$summary.scanErrorCount -ne 0) { throw "Expected zero scan errors, got $($summary.scanErrorCount)" }
          $candidates = Import-Csv -LiteralPath (Join-Path $out 'color_candidates.csv')
          if (-not ($candidates | Where-Object { $_.ContentHits -match 'hdr' })) { throw 'HDR keyword was not detected in fixture content.' }
          Write-Host 'No-argument/double-click path PASSED.'

      - name: Validate launcher cannot false-success without outputs
        shell: powershell
        run: |
          $cmd = Get-Content -LiteralPath 'modules\GraphicOverhaulVI\RUN-COLORCORE-SCAN.cmd' -Raw
          if ($cmd -notmatch 'scan_summary\.json') { throw 'Launcher is missing fresh-output success guard.' }
          if ($cmd -match 'if not "%~1"=="" if not "%~2"==""') { throw 'Broken nested IF pattern returned.' }
          Write-Host 'False-success guard PASSED.'
