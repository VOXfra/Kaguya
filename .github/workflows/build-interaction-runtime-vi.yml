name: Build Interaction Runtime VI

on:
  push:
    paths:
      - 'modules/InteractionRuntimeVI/**'
      - '.github/workflows/build-interaction-runtime-vi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch SHVDNE reference
        shell: pwsh
        run: |
          $url = 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          Expand-Archive shvdne.zip -DestinationPath shvdne
          $ref = Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if (-not $ref) { throw 'ScriptHookVDotNet3.dll not found.' }
          New-Item -ItemType Directory -Force modules/InteractionRuntimeVI/refs | Out-Null
          Copy-Item $ref.FullName modules/InteractionRuntimeVI/refs/ScriptHookVDotNet3.dll
      - name: Build
        shell: pwsh
        run: dotnet build modules/InteractionRuntimeVI/InteractionRuntimeVI.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/scripts | Out-Null
          Copy-Item modules/InteractionRuntimeVI/bin/Release/net48/InteractionRuntimeVI.dll dist/scripts/InteractionRuntimeVI.dll
          Copy-Item modules/InteractionRuntimeVI/config/InteractionRuntimeVI.ini dist/scripts/InteractionRuntimeVI.ini
          Copy-Item modules/InteractionRuntimeVI/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path dist/* -DestinationPath InteractionRuntimeVI-v0.2.0.zip -Force
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: InteractionRuntimeVI-v0.2.0
          path: InteractionRuntimeVI-v0.2.0.zip
          if-no-files-found: error
