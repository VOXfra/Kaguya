name: Build RDR2 to GTA V Direct Animation Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - rdr2-animation-bridge
    paths:
      - 'tools/RDR2AnimationBridge/**'
      - 'modules/RDR2AnimationBridgeVI/**'
      - '.github/workflows/build-rdr2-animation-bridge.yml'

jobs:
  build-direct-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Kaguya bridge branch
        uses: actions/checkout@v4

      - name: Reuse validated patched ArchiveExplorer helper
        uses: actions/download-artifact@v4
        with:
          name: VOX-RDR2-Animation-Bridge-First-YCD
          path: _helper_artifact
          github-token: ${{ github.token }}
          run-id: 33636267789

      - name: Clone pinned CodeWalker source
        shell: bash
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git _deps/CodeWalker
          git -C _deps/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e

      - name: Build Windows RSC8 to RSC7 YCD compatibility bridge
        shell: bash
        run: |
          CW="$GITHUB_WORKSPACE/_deps/CodeWalker"
          dotnet publish tools/RDR2AnimationBridge/Rdr2YcdCompat/Rdr2YcdCompat.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=false -p:CodeWalkerRoot="$CW" \
            -o _build/Rdr2YcdCompat

      - name: Install Windows Rust cross toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Build Windows RPF7 DLC packer
        shell: bash
        run: |
          cargo build --manifest-path tools/RDR2AnimationBridge/VoxRpfPack/Cargo.toml \
            --release --target x86_64-pc-windows-gnu

      - name: Fetch ScriptHookVDotNet Enhanced reference
        shell: bash
        run: |
          curl -L --fail -o shvdne.zip 'https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip'
          mkdir -p shvdne modules/RDR2AnimationBridgeVI/refs
          unzip -q shvdne.zip -d shvdne
          REF=$(find shvdne -type f -name ScriptHookVDotNet3.dll | head -n 1)
          test -n "$REF"
          cp "$REF" modules/RDR2AnimationBridgeVI/refs/ScriptHookVDotNet3.dll

      - name: Build GTA V Enhanced playback runtime
        shell: bash
        run: |
          dotnet build modules/RDR2AnimationBridgeVI/RDR2AnimationBridgeVI.csproj -c Release

      - name: Assemble direct bridge package
        shell: bash
        run: |
          set -euxo pipefail
          DIST='dist/VOX-RDR2-to-GTAV-Direct-Bridge'
          mkdir -p "$DIST/helper" "$DIST/bridge" "$DIST/runtime"

          test -f _helper_artifact/helper/ArchiveExplorer.exe
          cp _helper_artifact/helper/ArchiveExplorer.exe "$DIST/helper/"
          cp _helper_artifact/helper/*.dll "$DIST/helper/"

          cp -r _build/Rdr2YcdCompat/. "$DIST/bridge/"
          PACKER='tools/RDR2AnimationBridge/VoxRpfPack/target/x86_64-pc-windows-gnu/release/vox-rpf-pack.exe'
          test -f "$PACKER"
          cp "$PACKER" "$DIST/bridge/vox-rpf-pack.exe"

          RUNTIME='modules/RDR2AnimationBridgeVI/bin/Release/net48/RDR2AnimationBridgeVI.dll'
          test -f "$RUNTIME"
          cp "$RUNTIME" "$DIST/runtime/RDR2AnimationBridgeVI.dll"

          cp tools/RDR2AnimationBridge/RUN_DIRECT_GTA_BRIDGE.ps1 "$DIST/"
          cp tools/RDR2AnimationBridge/RUN_DIRECT_GTA_BRIDGE.bat "$DIST/"

          cat > "$DIST/BUILD.txt" <<'EOF'
          VOX RDR2 -> GTA V Direct Animation Bridge v0.1
          End-to-end target: one local RDR2 YCD -> CodeWalker ClipDictionary -> GTA V RSC7 YCD -> RPF7 DLC -> Enhanced F8 playback runtime.
          The source RDR2 animation, encryption keys and Oodle DLL are never bundled.
          ArchiveExplorer helper is the already validated patched build that achieved 3755/3755 YCD decodes.
          CodeWalker is pinned at 485d56bec00262ed7fa472261cce7bbc6202b96e.
          rpf-rs is pinned at 3526dde8b15570f76caa1433278e31a564506c8d.
          ScriptHookVDotNet Enhanced reference is v1.1.0.6.
          EOF

          find "$DIST" -maxdepth 3 -type f -printf '%p %s bytes\n'

      - name: Upload direct bridge
        uses: actions/upload-artifact@v4
        with:
          name: VOX-RDR2-to-GTAV-Direct-Bridge
          path: dist/VOX-RDR2-to-GTAV-Direct-Bridge
          if-no-files-found: error
          compression-level: 9
